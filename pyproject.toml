[project]
name = "fast-router"
version = "0.0.1"
description = "Local LLM smart router via Jev-style single-token task-type scoring"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mlx = ["mlx-lm", "modelscope", "huggingface_hub"]   # arm64 mac only (Apple Silicon)
torch = ["torch", "transformers", "modelscope", "huggingface_hub"]  # cross-platform: mac x64 / linux / windows
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
